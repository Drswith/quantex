name: Release

on:
  push:
    tags:
      - 'v*'
  repository_dispatch:
    types:
      - sync-quantex-cli-release
  workflow_dispatch:
    inputs:
      version:
        description: quantex-cli version to mirror
        required: true
      npm_tag:
        description: npm dist-tag to publish
        required: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.event.client_payload.version || inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Resolve release metadata
        id: meta
        env:
          REQUESTED_VERSION: ${{ github.event.client_payload.version || inputs.version || '' }}
          REQUESTED_NPM_TAG: ${{ github.event.client_payload.npm_tag || inputs.npm_tag || '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$REQUESTED_VERSION"
          fi

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$'; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          NPM_TAG="$REQUESTED_NPM_TAG"
          if [ -z "$NPM_TAG" ]; then
            case "$VERSION" in
              *-*) NPM_TAG=next ;;
              *) NPM_TAG=latest ;;
            esac
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm-tag=$NPM_TAG" >> "$GITHUB_OUTPUT"

      - name: Mirror quantex-cli version
        if: github.event_name != 'push'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          npm view "quantex-cli@$VERSION" version --registry https://registry.npmjs.org
          npm pkg set version="$VERSION"
          npm pkg set dependencies.quantex-cli="$VERSION"
          bun install
          bun run check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- package.json bun.lock; then
            echo "package.json and bun.lock already mirror quantex-cli@$VERSION"
          else
            git add package.json bun.lock
            git commit -m "Release $TAG"
            git push origin HEAD:main
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists"
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun pm pack --dry-run
      - name: Publish to npm
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          NPM_TAG: ${{ steps.meta.outputs.npm-tag }}
        run: |
          if npm view "quantex@$VERSION" version >/dev/null 2>&1; then
            echo "quantex@$VERSION is already published"
            VERSION_ALREADY_PUBLISHED=1
          else
            VERSION_ALREADY_PUBLISHED=0
            for attempt in 1 2 3 4 5; do
              if npm publish --provenance --access public --tag "$NPM_TAG"; then
                break
              fi

              if npm view "quantex@$VERSION" version >/dev/null 2>&1; then
                echo "quantex@$VERSION became visible after publish failure"
                break
              fi

              if [ "$attempt" = "5" ]; then
                exit 1
              fi

              sleep "$((attempt * 20))"
            done
          fi

          CURRENT_TAG="$(npm view "quantex@${NPM_TAG}" version 2>/dev/null || true)"
          if [ "$CURRENT_TAG" != "$VERSION" ]; then
            echo "::warning::npm dist-tag '$NPM_TAG' currently points to '${CURRENT_TAG:-<missing>}' instead of '$VERSION'"
            if [ "$VERSION_ALREADY_PUBLISHED" = "1" ]; then
              echo "::warning::Trusted publishing cannot correct dist-tags for already-published versions; run 'npm dist-tag add quantex@$VERSION $NPM_TAG' with an npm token if needed."
            fi
          fi
      - name: Create GitHub release
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG release already exists"
          else
            gh release create "$TAG" --generate-notes --verify-tag
          fi
