name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Resolve release metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$'; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          case "$VERSION" in
            *-*) NPM_TAG=next ;;
            *) NPM_TAG=latest ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm-tag=$NPM_TAG" >> "$GITHUB_OUTPUT"

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun pm pack --dry-run
      - name: Publish to npm
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          NPM_TAG: ${{ steps.meta.outputs.npm-tag }}
        run: |
          if npm view "quantex@$VERSION" version >/dev/null 2>&1; then
            echo "quantex@$VERSION is already published"
            VERSION_ALREADY_PUBLISHED=1
          else
            VERSION_ALREADY_PUBLISHED=0
            for attempt in 1 2 3 4 5; do
              if npm publish --provenance --access public --tag "$NPM_TAG"; then
                break
              fi

              if npm view "quantex@$VERSION" version >/dev/null 2>&1; then
                echo "quantex@$VERSION became visible after publish failure"
                break
              fi

              if [ "$attempt" = "5" ]; then
                exit 1
              fi

              sleep "$((attempt * 20))"
            done
          fi

          CURRENT_TAG="$(npm view "quantex@${NPM_TAG}" version 2>/dev/null || true)"
          if [ "$CURRENT_TAG" != "$VERSION" ]; then
            echo "::warning::npm dist-tag '$NPM_TAG' currently points to '${CURRENT_TAG:-<missing>}' instead of '$VERSION'"
            if [ "$VERSION_ALREADY_PUBLISHED" = "1" ]; then
              echo "::warning::Trusted publishing cannot correct dist-tags for already-published versions; run 'npm dist-tag add quantex@$VERSION $NPM_TAG' with an npm token if needed."
            fi
          fi
      - name: Create GitHub release
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG release already exists"
          else
            gh release create "$TAG" --generate-notes --verify-tag
          fi
